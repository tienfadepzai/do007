---
- name: Send Hello World to Telegram
  hosts: localhost
  connection: local
  gather_facts: false

  var_files:
    - vault.yml

  tasks:
    - name: Send Hello World
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_bot_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram_chat_id }}"
          text: "Hello World"
        status_code: 200